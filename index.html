<script id="course-data" type="application/json">{"units":[{"id":"8a","lesson":8,"title":"Маю та не маю","sub":"turiu · neturiu · ką? / ko?","icon":"family","intro":"Turėti означає «мати». Після ствердження ставимо назву людини або предмета у знахідному відмінку. Після заперечення neturėti — у родовому.","heads":["Особа","Маю","Не маю"],"rows":[["Aš","turiu","neturiu"],["Tu","turi","neturi"],["Jis / ji","turi","neturi"],["Mes","turime","neturime"],["Jūs","turite","neturite"],["Jie / jos","turi","neturi"]],"tips":["Aš turiu brolį. — Я маю брата. Aš neturiu brolio. — Я не маю брата.","Запам’ятай пару запитань: turiu ką? — маю кого / що?; neturiu ko? — не маю кого / чого?","Tu, jis, ji, jie, jos мають однакову форму turi. Особу визначає займенник або контекст.","Ne- пишемо разом: neturiu, neturime. Ar turi seserį? — Чи маєш сестру?"],"source":"PDF уроку 8, с. 2–4. Додаткові тренувальні речення."},{"id":"8b","lesson":8,"title":"Родина у двох відмінках","sub":"brolį → brolio · dukterį → dukters","icon":"tree","intro":"Порівнюй слово одразу у трьох формах: хто це; кого маю; кого не маю. Не всі слова змінюються за однією моделлю.","heads":["Хто? kas?","Маю кого? ką?","Не маю кого? ko?"],"rows":[["brolis","brolį","brolio"],["sesuo","seserį","sesers"],["sesė","sesę","sesės"],["mama","mamą","mamos"],["tėvas","tėvą","tėvo"],["sūnus","sūnų","sūnaus"],["duktė","dukterį","dukters"],["žmona","žmoną","žmonos"],["vyras","vyrą","vyro"],["vaikas","vaiką","vaiko"],["senelis","senelį","senelio"],["senelė","senelę","senelės"],["teta","tetą","tetos"],["dėdė","dėdę","dėdės"],["pusbrolis","pusbrolį","pusbrolio"],["pusseserė","pusseserę","pusseserės"],["draugas","draugą","draugo"],["draugė","draugę","draugės"]],"tips":["brolis → brolį → brolio; mama → mamą → mamos; senelė → senelę → senelės.","Окремо вивчи: sesuo → seserį → sesers; duktė → dukterį → dukters; sūnus → sūnų → sūnaus.","Sesuo та sesė — два нормативні слова «сестра»: turiu seserį / sesę; neturiu sesers / sesės.","Вправи з указаним початковим словом очікують форми саме цього слова. Для sesuo пиши seserį, для sesė — sesę.","У цього застосунку родина — набір навчальних прикладів; обирай для власної розповіді правдиві речення."],"source":"PDF уроку 8, с. 2–4. Додатково: tėvo, dėdė та регулярні форми для закріплення."},{"id":"8c","lesson":8,"title":"Три форми й три типи","sub":"-a / -ia · -i · -o","icon":"layers","intro":"Дієслово вчимо трійкою: інфінітив, третя особа теперішнього часу, третя особа минулого часу. Тип теперішнього часу визначаємо за другою формою.","heads":["Тип","Третя особа","Приклад"],"rows":[["I · -(i)a","-a або -ia","gyvena · žaidžia"],["II · -i","-i","turi · myli"],["III · -o","-o","daro · mato"],["Виняток","yra","būti → yra → buvo"]],"tips":["gyventi, gyvena, gyveno — жити, живе, жив / жила. Зараз відмінюємо теперішній час; минулу форму вчимо як частину словникової трійки.","Не визначай тип за самим інфінітивом: kalbėti → kalba, але mylėti → myli.","Žaidžia належить до першого типу -(i)a. Літера i перед a не перетворює його на тип -i.","Būti — виняток: esu, esi, yra, esame, esate, yra.","У практиці відкрий «Дієслівна майстерня»: там є повні таблиці всіх 27 дієслів."],"source":"PDF уроку 8, с. 5–12. Моделі теперішнього часу звірено з SIH та університетським курсом Baltic Online."},{"id":"8d","lesson":8,"title":"Тип -a: живу й працюю","sub":"gyvenu · kalbu · studijuoju","icon":"home","intro":"Для більшості дієслів типу -a форма aš має -u, tu — -i, mes — -ame, jūs — -ate. У третій особі однини й множини форма однакова.","heads":["Особа","gyventi","dirbti","studijuoti"],"rows":[["Aš","gyvenu","dirbu","studijuoju"],["Tu","gyveni","dirbi","studijuoji"],["Jis / ji","gyvena","dirba","studijuoja"],["Mes","gyvename","dirbame","studijuojame"],["Jūs","gyvenate","dirbate","studijuojate"],["Jie / jos","gyvena","dirba","studijuoja"]],"tips":["gyvena → gyvenu, gyveni, gyvename, gyvenate.","Kalbėti теж тип -a: kalbu, kalbi, kalba, kalbame, kalbate, kalba.","Studijuoja зберігає -j-: studijuoju, studijuoji, studijuojame. Це навчання у вищому навчальному закладі.","Suprasti змінює основу: suprantu, supranti, supranta. Її слід запам’ятати за другою словниковою формою.","Gyvenu Kaune. — Живу в Каунасі. Kalbu lietuviškai. — Говорю литовською."],"source":"PDF уроку 8, с. 5–7, 12. Додаткові приклади й повні парадигми."},{"id":"8e","lesson":8,"title":"Тип -a: змінюється основа","sub":"mėgstu · žaidžiu · susipažįstu","icon":"spark","intro":"Пам’ятай не лише закінчення, а й основу: mėgsta, pasiilgsta, susipažįsta, žaidžia. Не намагайся додати закінчення прямо до інфінітива.","heads":["Особа","mėgti","žaisti","susipažinti"],"rows":[["Aš","mėgstu","žaidžiu","susipažįstu"],["Tu","mėgsti","žaidi","susipažįsti"],["Jis / ji","mėgsta","žaidžia","susipažįsta"],["Mes","mėgstame","žaidžiame","susipažįstame"],["Jūs","mėgstate","žaidžiate","susipažįstate"],["Jie / jos","mėgsta","žaidžia","susipažįsta"]],"tips":["Mėgti → mėgsta → aš mėgstu. Не «mėgiu». Pasiilgti → pasiilgsta → aš pasiilgstu.","Susipažinti → susipažįsta → susipažįstu. Літера į у теперішньому часі важлива.","Žaisti: aš žaidžiu, tu žaidi, jis žaidžia, mes žaidžiame, jūs žaidžiate, jie žaidžia.","Mėgstu sportą. — Полюбляю спорт. Žaidžiu futbolą. — Граю у футбол.","Susipažįstu su draugu. — Знайомлюся з другом. У цьому прикладі su + орудний; це додаткова підказка, а не головна тема уроку."],"source":"PDF уроку 8, с. 7, 12. Приклади й особові форми доповнено."},{"id":"8f","lesson":8,"title":"Тип -i: можу й хочу","sub":"galiu · noriu · myliu","icon":"heart","intro":"У типі -i третя особа має закінчення -i. Для aš зазвичай маємо -iu, для mes — -ime, для jūs — -ite. Tu збігається з третьою особою.","heads":["Особа","galėti","norėti","mylėti"],"rows":[["Aš","galiu","noriu","myliu"],["Tu","gali","nori","myli"],["Jis / ji","gali","nori","myli"],["Mes","galime","norime","mylime"],["Jūs","galite","norite","mylite"],["Jie / jos","gali","nori","myli"]],"tips":["Galiu, gali, gali, galime, galite, gali. Mylėti: myliu, myli, myli, mylime, mylite, myli.","Сюди належать turėti, norėti, mylėti, galėti, stovėti, žiūrėti, tikėti, gulėti, sėdėti, girdėti.","Пиши stoviu, žiūriu, guliu, tikiu. Зверни увагу на довге ū у žiūriu.","Я і ти: aš noriu / tu nori; ми і ви: mes norime / jūs norite.","Sėdėti й girdėti мають особливу форму aš. Їм присвячено наступний блок."],"source":"PDF уроку 8, с. 9–14. Tikėti та gulėti взято зі списку на с. 12."},{"id":"8g","lesson":8,"title":"Чую й сиджу: d → dž","sub":"girdžiu · sėdžiu","icon":"ear","intro":"У формах aš дієслів girdėti та sėdėti приголосний d переходить у dž. У решті особових форм цього переходу немає.","heads":["Особа","sėdėti","girdėti"],"rows":[["Aš","sėdžiu","girdžiu"],["Tu","sėdi","girdi"],["Jis / ji","sėdi","girdi"],["Mes","sėdime","girdime"],["Jūs","sėdite","girdite"],["Jie / jos","sėdi","girdi"]],"tips":["Aš sėdžiu, але tu sėdi, mes sėdime. Не «sėdiu» і не «sėdžime».","Aš girdžiu, але tu girdi, jūs girdite. Не «girdiu» і не «girdžite».","Порівняй: aš žaidžiu / tu žaidi з попереднього блоку. Повні парадигми різняться, тому їх слід вчити окремо.","Aš girdžiu muziką. — Я чую музику. Mes sėdime kavinėje. — Ми сидимо в кав’ярні."],"source":"PDF уроку 8, с. 10, 12–14."},{"id":"8h","lesson":8,"title":"Тип -o: роблю, бачу, знаю","sub":"darau · matau · žinau","icon":"book","intro":"Третій тип має -o у третій особі. У теперішньому часі aš закінчується на -au, tu — на -ai, mes — на -ome, jūs — на -ote.","heads":["Особа","daryti","matyti","žinoti"],"rows":[["Aš","darau","matau","žinau"],["Tu","darai","matai","žinai"],["Jis / ji","daro","mato","žino"],["Mes","darome","matome","žinome"],["Jūs","darote","matote","žinote"],["Jie / jos","daro","mato","žino"]],"tips":["Daryti → daro: darau, darai, daro, darome, darote, daro.","Matyti → mato: matau, matai, mato, matome, matote, mato.","Žinoti → žino: žinau, žinai, žino, žinome, žinote, žino.","У PDF тип -o представлено на с. 5. Повні таблиці тут — додаткове закріплення цього правила.","Žinoti — знати факт; suprasti — розуміти. Tai suprantu. — Це розумію. Tai žinau. — Це знаю."],"source":"PDF уроку 8, с. 5; повні парадигми — додатковий матеріал за моделлю типу -o."},{"id":"8i","lesson":8,"title":"Подобається чи люблю?","sub":"man patinka · aš mėgstu · aš myliu","icon":"flower","intro":"Українське «люблю» перекладається по-різному. Patikti описує те, що подобається; mėgti — вподобання; mylėti — любов або прив’язаність.","heads":["Модель","Приклад","Українською"],"rows":[["kam? + patinka + kas?","Man patinka kava.","Мені подобається кава."],["kas? + mėgsta + ką?","Aš mėgstu kavą.","Я полюбляю каву."],["kas? + myli + ką?","Aš myliu mamą.","Я люблю маму."],["nepatinka + kas?","Man nepatinka kava.","Мені не подобається кава."],["nemėgsta + ko?","Aš nemėgstu kavos.","Я не люблю кави."]],"tips":["Man — мені, tau — тобі, jam — йому, jai — їй, mums — нам, jums — вам, jiems / joms — їм.","У Man patinka kava підмет — kava: називний kas? У Aš mėgstu kavą прямий додаток — kavą: знахідний ką?","Зі стравами, напоями й захопленнями у звичайному навчальному мовленні доречне mėgti; з близькими людьми — mylėti.","Не роби висновок, що mėgti ніколи не вживають про людей. Значення ширші; тут вчимо базове розрізнення.","Заперечення різне: nemėgstu kavos, але man nepatinka kava. У другому реченні kava залишається підметом."],"source":"PDF уроку 8, с. 7–9. Значення зіставлено з мовними порадами Клайпеди."},{"id":"8j","lesson":8,"title":"Хочу та можу","sub":"noriu kavos · galiu kalbėti","icon":"bolt","intro":"Norėti з назвою бажаного вимагає родового: noriu kavos. Norėti та galėti також сполучаються з інфінітивом: noriu kalbėti, galiu kalbėti.","heads":["Що висловлюємо","Литовською","Українською"],"rows":[["Бажаний напій","Noriu kavos.","Хочу кави."],["Бажана дія","Noriu kalbėti.","Хочу говорити."],["Можливість","Galiu kalbėti.","Можу говорити."],["Спільне бажання","Norime žaisti.","Хочемо грати."],["Можливість для вас","Galite dirbti.","Можете працювати."]],"tips":["Norėti + ko?: kavos, arbatos, vandens. Це родовий, навіть без заперечення.","Після особової форми noriu / galiu дієслово дії залишається в інфінітиві: kalbėti, dirbti, žaisti.","Ar nori kavos? — Хочеш кави? Ar gali kalbėti? — Можеш говорити?","Не плутай значення: noriu — хочу; galiu — можу.","Negaliu kalbėti. — Не можу говорити. Nenoriu kavos. — Не хочу кави."],"source":"PDF уроку 8, с. 9, 11–12; моделі з інфінітивом — додаткові навчальні приклади."},{"id":"8k","lesson":8,"title":"Сумую за рідними","sub":"pasiilgstu + ko?","icon":"repeat","intro":"Українське «сумую за кимось» у цій литовській моделі передається дієсловом pasiilgti та родовим відмінком без прийменника.","heads":["Хто?","Сумую за ким?","Українською"],"rows":[["brolis","Pasiilgstu brolio.","Сумую за братом."],["sesuo","Pasiilgstu sesers.","Сумую за сестрою."],["mama","Pasiilgstu mamos.","Сумую за мамою."],["tėvas","Pasiilgstu tėvo.","Сумую за батьком."],["draugas","Pasiilgstu draugo.","Сумую за другом."]],"tips":["Pasiilgti, pasiilgsta, pasiilgo — словникові форми. Aš pasiilgstu, mes pasiilgstame.","Pasiilgstu ko? — mamos, brolio, sesers. Форми ті самі, що у neturiu ko?, але тут немає заперечення.","У вправі на форму слова brolis пиши brolio. Не додавай за українською моделлю окремий прийменник.","У живому мовленні pasiilgau часто означає «я скучив / скучила». Це минулий час; основний тренажер цього уроку працює з теперішнім."],"source":"PDF уроку 8, с. 7; поєднання з родовим — додаткові приклади."},{"id":"8l","lesson":8,"title":"Запитай і запереч","sub":"ar? · ne- · nėra","icon":"chat","intro":"Загальне запитання часто починається з Ar. Для заперечення до дієслова додаємо ne-. Būti має особливі заперечні форми.","heads":["Ствердження","Заперечення","Запитання"],"rows":[["Aš turiu brolį.","Aš neturiu brolio.","Ar turi brolį?"],["Aš kalbu.","Aš nekalbu.","Ar kalbi?"],["Aš myliu mamą.","Aš nemyliu mamos.","Ar myli mamą?"],["Jis yra namie.","Jo nėra namie.","Ar jis yra namie?"],["Aš esu mokytojas.","Aš nesu mokytojas.","Ar tu esi mokytojas?"]],"tips":["Ne- пишемо разом: negaliu, nenoriu, negirdžiu, nesuprantu.","Būti: nesu, nesi, nėra, nesame, nesate, nėra. Не «neesu» та не «neyra».","При запереченні прямого додатка знахідний змінюється на родовий: matau brolį → nematau brolio.","У запереченні іменного присудка називний зберігається: jis nėra mokytojas.","Jo nėra namie — його немає вдома. Це додатковий приклад відсутності; не змішуй його з іменним присудком."],"source":"PDF уроку 8, с. 2, 12. Запитання та заперечення — повторення й закріплення."},{"id":"8m","lesson":8,"title":"Читаємо «Mano šeima»","sub":"Рута, Петрас, Паулюс і Саулюс","icon":"book","intro":"Прочитай повний текст з останньої сторінки PDF. Відкрий його через кнопку нижче або в практиці. Відповідай лише за явно поданою інформацією.","heads":["Хто?","Що відомо з тексту"],"rows":[["Rūta","працює у Вільнюсі, у музичній школі"],["Petras","економіст; працює в Каунасі"],["Paulius ir Saulius","сини; ходять до школи; полюбляють спорт"],["Rūtos tėvai","живуть в Утені"],["Šeima","живе біля Вільнюса; будинок біля річки"]],"tips":["Prie Vilniaus — біля Вільнюса, а не в самому місті. Prie upės — біля річки.","Rūta та Petras часто гуляють у лісі. Будинок біля річки не доводить, що вони гуляють саме біля річки.","Увечері Petras працює в саду, а Rūta дивиться телевізор.","Хлопці грають у футбол у вівторок і четвер. У суботу всі їздять до басейну.","Текст не стверджує, що хлопці ніколи не грають у вихідні. Не вгадуй факти, яких немає.","Кнопка «Читати текст» відкриває весь оригінал, український переклад та окремий набір запитань."],"source":"PDF уроку 8, с. 16–17. Текст і твердження прочитано також зі зображень сторінок."},{"id":"8n","lesson":8,"title":"Мій звичайний день","sub":"einu · važiuoju · vaikščioju","icon":"route","intro":"Поєднай дієслова з описом звичайного дня. Відрізняй eiti — іти пішки, važiuoti — їхати транспортом, vaikščioti — ходити або гуляти.","heads":["Дія","Приклад","Українською"],"rows":[["eiti","Einu į mokyklą.","Іду до школи."],["važiuoti","Važiuoju į darbą.","Їду на роботу."],["vaikščioti","Vaikščioju parke.","Гуляю в парку."],["žiūrėti","Vakare žiūriu televizorių.","Увечері дивлюся телевізор."],["žaisti","Žaidžiame futbolą.","Граємо у футбол."]],"tips":["Į + знахідний позначає напрям: į mokyklą, į darbą, į baseiną, į kavinę.","Місце дії: miške — у лісі; parke — у парку; sode — у саду; mokykloje — у школі.","Laikas: rytą — уранці, vakare — увечері, kasdien — щодня, savaitgalį — на вихідних.","Antradienį — у вівторок; ketvirtadienį — у четвер; šeštadienį — у суботу.","Додаткові короткі діалоги складено для практики. Вони не подаються як дослівні діалоги з PDF.","У «Конструкторі» склади розповідь про себе: маю / не маю, полюбляю, можу, хочу."],"source":"PDF уроку 8, с. 16–17; додаткові діалоги та парадигми дієслів із цього тексту."}],"cards":[{"id":"c8_1","units":["8c"],"lt":"turėti","uk":"мати","note":"turėti, turi, turėjo. turėti + ką?; neturėti + ko?"},{"id":"c8_2","units":["8a"],"lt":"Aš turiu","uk":"я маю","note":"turėti, turi, turėjo. turėti + ką?; neturėti + ko?"},{"id":"c8_3","units":["8a"],"lt":"Tu turi","uk":"ти маєш","note":"turėti, turi, turėjo. turėti + ką?; neturėti + ko?"},{"id":"c8_4","units":["8a"],"lt":"Jis turi","uk":"він / вона має","note":"turėti, turi, turėjo. turėti + ką?; neturėti + ko?"},{"id":"c8_5","units":["8a"],"lt":"Mes turime","uk":"ми маємо","note":"turėti, turi, turėjo. turėti + ką?; neturėti + ko?"},{"id":"c8_6","units":["8a"],"lt":"Jūs turite","uk":"ви маєте","note":"turėti, turi, turėjo. turėti + ką?; neturėti + ko?"},{"id":"c8_7","units":["8a"],"lt":"Jie turi","uk":"вони мають","note":"turėti, turi, turėjo. turėti + ką?; neturėti + ko?"},{"id":"c8_8","units":["8c"],"lt":"gyventi","uk":"жити","note":"gyventi, gyvena, gyveno. "},{"id":"c8_9","units":["8d"],"lt":"Aš gyvenu","uk":"я живу","note":"gyventi, gyvena, gyveno. "},{"id":"c8_10","units":["8d"],"lt":"Tu gyveni","uk":"ти живеш","note":"gyventi, gyvena, gyveno. "},{"id":"c8_11","units":["8d"],"lt" о означає «lėtai»?","answers":["повільно"],"why":"lėtai — повільно.","options":["повільно","біля Вільнюса","біля річки","неподалік"],"card":"c8_323","optionLang":"uk"}],"dialogues":[{"id":"r8","unit":"8m","title":"Mano šeima · повний текст","kind":"reading","lines":[["Rūta","Mano vardas yra Rūta. Mano šeima gyvena prie Vilniaus. Mūsų namas yra prie upės. Netoli yra miškas. Aš ir mano vyras Petras dažnai vaikščiojame miške. Kasdien vakare mano vyras dirba sode, o aš žiūriu televizorių."],["Rūta","Paulius ir Saulius yra mūsų sūnūs. Jie jau eina į mokyklą. Berniukai labai mėgsta sportą. Antradienį ir ketvirtadienį jie žaidžia futbolą, o šeštadienį visi kartu važiuojame į baseiną."],["Rūta","Mano tėvai gyvena Utenoje. Savaitgalį dažnai važiuoju pas tėvus. Kartais mes kartu einame į kavinę arba vaikščiojame parke."],["Rūta","Aš dirbu Vilniuje, muzikos mokykloje. Mano vyras yra ekonomistas. Jis dirba Kaune. Petras kasdien rytą važiuoja į darbą, o vakare – namo."]],"uk":["Мене звати Рута. Моя родина живе біля Вільнюса. Наш будинок розташований біля річки. Неподалік є ліс. Ми з моїм чоловіком Петрасом часто гуляємо в лісі. Щодня ввечері мій чоловік працює в саду, а я дивлюся телевізор.","Паулюс і Саулюс — наші сини. Вони вже ходять до школи. Хлопці дуже полюбляють спорт. У вівторок і четвер вони грають у футбол, а в суботу ми всі разом їздимо до басейну.","Мої батьки живуть в Утені. На вихідних я часто їжджу до батьків. Іноді ми разом ідемо до кав’ярні або гуляємо в парку.","Я працюю у Вільнюсі, у музичній школі. Мій чоловік — економіст. Він працює в Каунасі. Петрас щодня вранці їде на роботу, а ввечері — додому."],"source":"Оригінальний текст із PDF уроку 8, с. 17; український переклад підготовлено для застосунку."},{"id":"d8a","unit":"8a","title":"Маєш брата?","kind":"dialogue","lines":[["Agnė","Ar turi brolį?"],["Tomas","Taip, turiu brolį. O tu?"],["Agnė","Aš neturiu brolio, bet turiu seserį."],["Tomas","Ar tavo sesuo gyvena Kaune?"],["Agnė","Taip, ji gyvena Kaune."]],"uk":["Чи маєш брата?","Так, маю брата. А ти?","Я не маю брата, але маю сестру.","Твоя сестра живе в Каунасі?","Так, вона живе в Каунасі."],"source":"Додатковий навчальний діалог за лексикою уроку 8; складено для цього застосунку."},{"id":"d8b","unit":"8i","title":"Кава чи чай?","kind":"dialogue","lines":[["Lina","Ar nori kavos?"],["Tomas","Ne, ačiū. Aš nemėgstu kavos."],["Lina","Gal nori arbatos?"],["Tomas","Taip, ačiū. Man patinka arbata."]],"uk":["Чи хочеш кави?","Ні, дякую. Я не полюбляю кави.","Може, хочеш чаю?","Так, дякую. Мені подобається чай."],"source":"Додатковий навчальний діалог за лексикою уроку 8; складено для цього застосунку."},{"id":"d8c","unit":"8j","title":"Можеш говорити?","kind":"dialogue","lines":[["Rasa","Ar gali kalbėti lietuviškai?"],["Jonas","Taip, galiu, bet kalbu lėtai."],["Rasa","Ar nori žaisti futbolą?"],["Jonas","Taip, noriu. Man patinka sportas."]],"uk":["Чи можеш говорити литовською?","Так, можу, але говорю повільно.","Чи хочеш грати у футбол?","Так, хочу. Мені подобається спорт."],"source":"Додатковий навчальний діалог за лексикою уроку 8; складено для цього застосунку."},{"id":"d8d","unit":"8n","title":"Після роботи","kind":"dialogue","lines":[["Agnė","Kur dirbi?"],["Tomas","Dirbu Kaune. O tu?"],["Agnė","Aš dirbu Vilniuje. Vakare vaikščioju parke."],["Tomas","Aš vakare žiūriu televizorių."]],"uk":["Де працюєш?","Працюю в Каунасі. А ти?","Я працюю у Вільнюсі. Увечері гуляю в парку.","Я ввечері дивлюся телевізор."],"source":"Додатковий навчальний діалог за лексикою уроку 8; складено для цього застосунку."}],"nouns":[["brolis","брат","brolį","brolio","брата"],["sesuo","сестра","seserį","sesers","сестру / сестри"],["sesė","сестра (інша форма)","sesę","sesės","сестру / сестри"],["mama","мама","mamą","mamos","маму / мами"],["tėvas","батько","tėvą","tėvo","батька"],["sūnus","син","sūnų","sūnaus","сина"],["duktė","донька","dukterį","dukters","доньку / доньки"],["žmona","дружина","žmoną","žmonos","дружину / дружини"],["vyras","чоловік","vyrą  return `${heading('Пригадай слово','Не поспішай відкривати відповідь.')}<div class="flash-count"><span>${flash.at+1} / ${flash.ids.length}</span><span>${flash.direction==='lt'?'LT → UA':'UA → LT'}</span></div><div class="progress-track" style="margin-top:9px"><div class="progress-fill" style="width:${flash.at/flash.ids.length*100}%"></div></div><div class="flash"><button class="circle-btn small" data-action="speak-card" data-id="${c.id}" aria-label="Озвучити литовською">${ico('volume')}</button><div class="eyebrow">${flash.direction==='lt'?'Що це означає?':'Як це литовською?'}</div><div class="word">${E(front)}</div>${flash.shown?`<div class="translation">${E(backText)}</div><p class="hint">${E(c.note)}</p>`:'<div class="hint">Скажи відповідь уголос або подумки.</div>'}</div>${flash.shown?`<div class="row flash-rate">${button('Ще вчу','flash-rate','secondary','no','repeat')}${button('Пригадав / ла','flash-rate','primary','yes','check')}</div>`:button('Показати відповідь','flash-reveal','primary')}<div class="gap-top">${button('Завершити добірку','flash-exit','ghost')}</div>`;
}
function startFlash(mode){let pool=D.cards.filter(c=>cardLesson==='all'||c.units.some(id=>String(U[id].lesson)===cardLesson));const due=pool.filter(c=>S.cards[c.id]?.due<=Date.now()),unseen=pool.filter(c=>!S.cards[c.id]);
 if(mode==='due')pool=due;else if(mode==='new')pool=unseen;else if(mode==='favorites')pool=pool.filter(c=>S.favorites[c.id]);else pool=[...shuffle(due),...shuffle(unseen),...shuffle(pool.filter(c=>S.cards[c.id]&&S.cards[c.id].due>Date.now()))];
 if(!pool.length){toast(mode==='due'?'Запланованих повторень поки немає. Почни нові картки.':'У цій добірці поки немає карток.');return;}
 flash={ids:(mode==='smart'?pool:shuffle(pool)).slice(0,20).map(c=>c.id),at:0,shown:false,known:0,direction:cardDirection};render();}
function startPairs(){let pool=D.cards.filter(c=>c.lt.length<25&&c.uk.length<30&&!c.uk.includes('форма')&&!c.uk.includes('звертання')&&!c.uk.includes('множина'));const seenLT=new Set(),seenUK=new Set();pool=shuffle(pool).filter(c=>{if(seenLT.has(c.lt)||seenUK.has(c.uk))return false;seenLT.add(c.lt);seenUK.add(c.uk);return true;});const ids=pool.slice(0,5).map(c=>c.id);pairs={left:shuffle(ids),right:shuffle(ids),selectedL:null,selectedR:null,done:[],wrong:[],tries:0};view='pairs';render();}
function screenPairs(){const completed=pairs.done.length===5;return `${heading('Знайди пари','Обери слово та його український переклад.','arrows')}<div class="row split small muted" style="margin-bottom:18px"><span>Знайдено ${pairs.done.length} / 5</span><span>Спроб: ${pairs.tries}</span></div><div class="match-grid">${['left','right'].map((side,i)=>`<div class="match-col">${pairs[side].map(id=>`<button class="match-word ${pairs.done.includes(id)?'matched':''} ${(i===0?pairs.selectedL:pairs.selectedR)===id?'active':''} ${pairs.wrong.includes(side+id)?'miss':''}" data-action="pair" data-id="${side}|${id}" ${pairs.done.includes(id)?'disabled':''}>${E(i===0?C[id].lt:C[id].uk)}</button>`).join('')}</div>`).join('')}</div>${completed?`<div class="feedback gap-top"><h3>${ico('check')}Усі пари знайдено!</h3><p>+20 XP. Наступного разу спробуй пригадати слова без підказок.</p></div>${button('Нові пари','pairs','primary','','repeat')}`:''}<div class="gap-top">${button('До практики','go','ghost','practice')}</div>`;}

function screenProfile(){const known=Object.values(S.cards).filter(x=>x.level>=3).length;return `${heading('Твій прогрес','Навіть п’ять хвилин мають значення.')}<div class="profile-top">${mascot()}<div><div class="eyebrow muted">Labas! · Урок 8</div><h2>${mastered()} / ${D.units.length} блоків</h2><p>Крок за кроком — до розмови.</p></div></div><div class="stats-grid"><div class="stat"><strong>${S.xp} XP</strong><span>накопичено досвіду</span></div><div class="stat"><strong>${streak()}</strong><span>днів поспіль</span></div><div class="stat"><strong>${S.answered?Math.round(S.correct/S.answered*100):0}%</strong><span>точність перших спроб</span></div><div class="stat"><strong>${known}</strong><span>карток на щаблі 3–5</span></div></div><div class="panel"><h3>Твій тиждень</h3><div class="calendar-days">${[6,5,4,3,2,1,0].map(n=>{const d=new Date(dayAgo(n)+'T12:00:00');return `<div class="day ${S.days[dayAgo(n)]?'on':''}">${['Нд','Пн','Вт','Ср','Чт','Пт','Сб'][d.getDay()]}<b>${S.days[dayAgo(n)]?'✓':d.getDate()}</b>${n===0?'нині':''}</div>`}).join('')}</div><div class="badge-list"><span class="badge ${S.answered?'':'locked'}">Перший крок</span><span class="badge ${mastered()>=6?'':'locked'}">6 блоків</span><span class="badge ${streak()>=3?'':'locked'}">3 дні поспіль</span><span class="badge ${S.exams.length?'':'locked'}">Перший тест</span></div></div>${goal()}<div class="panel"><h3>Налаштування навчання</h3><label class="field gap-top">Щоденна ціль<select id="daily-goal">${[6,12,20].map(n=>`<option value="${n}" ${S.settings.goal===n?'selected':''}>${n} навчальних дій</option>`).join('')}</select></label><div class="toggle-row"><label for="strict-mode"><b>Точні литовські літери</b><br><span class="muted">Письмо: ą, ė, į, ų, ū мають значення.</span></label><input id="strict-mode" type="checkbox" ${S.settings.strict?'checked':''}></div><div class="toggle-row"><label for="slow-voice"><b>Повільне озвучення</b><br><span class="muted">Легше почути закінчення.</span></label><input id="slow-voice" type="checkbox" ${S.settings.slow?'checked':''}></div><p class="small muted gap-top">Литовський голос: <span id="voice-status">${ltVoice()?'доступний':'не знайдено на цьому пристрої'}</span>.</p></div><div class="panel" id="reminders"><h3>Нагадування в календарі</h3><p class="small muted">Обери час і додай файл у календар телефона. Закритий HTML сам не надсилає сповіщень.</p><label class="field">Час занять, місцевий<input id="reminder-time" type="time" value="${E(S.reminder)}"></label><div class="stack">${button('Щодня · на 30 днів','calendar','primary','daily','calendar')}${button('Повторення через 1, 3, 7, 14 днів','calendar','secondary','spaced')}</div><p class="small muted gap-top">Файл .ics потрібно імпортувати. Сповіщення залежить від налаштувань твого календаря.</p></div>${S.exams.length?`<div class="panel"><h3>Останні тести</h3>${S.exams.slice(-5).reverse().map(x=>`<div class="source-card"><h3>${E(x.title)} · ${x.score}%</h3><p>${new Date(x.date).toLocaleDateString('uk-UA')} · ${x.total} завдань</p></div>`).join('')}</div>`:''}<div class="panel"><h3>Твій прогрес із тобою</h3><p class="small muted">Результати зберігаються в цьому браузері. Перед зміною телефона або очищенням даних завантаж резервну копію.</p><div class="stack">${button('Завантажити резервну копію','export','secondary','','download')}${button('Відновити з JSON-копії','import','ghost')}${button('Джерела й довідка','go','ghost','sources','info')}</div></div><button class="btn danger" data-action="reset">Скинути прогрес уроку 8</button>`;}
let voices=[];
function readVoices(){try{voices=window.speechSynthesis?.getVoices()||[];const s=document.getElementById('voice-status');if(s)s.textContent=ltVoice()?'доступний':'не знайдено на цьому пристрої';}catch(e){voices=[];}}
function ltVoice(){return voices.find(v=>/^lt(-|_)?/i.test(v.lang));}
function stopSpeech(){try{window.speechSynthesis?.cancel();}catch(e){}}
function speak(text){readVoices();const voice=ltVoice();if(!voice||!window.SpeechSynthesisUtterance){toast('Литовського голосу немає. Додай голос lt-LT у налаштуваннях пристрою або читай текст.');return;}stopSpeech();const chunks=String(text).match(/[^.!?]+[.!?]*/g)||[String(text)];for(const chunk of chunks){const u=new SpeechSynthesisUtterance(chunk);u.lang='lt-LT';u.voice=voice;u.rate=S.settings.slow?.78:.96;u.onerror=()=>toast('Не вдалося озвучити. Перевір доступність литовського голосу.');window.speechSynthesis.speak(u);}}
function download(name,body,type){const blob=new Blob([body],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);}
const icsEscape=s=>String(s).replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/;/g,'\\;').replace(/,/g,'\\,');
function foldIcs(s){const encoder=new TextEncoder();let lines=[],line='';for(const c of s){if(encoder.encode(line+c).length>73){lines.push(line);line=' '+c;}else line+=c;}lines.push(line);return lines.join('\r\n');}
function calendarText(mode,base=new Date()){
 const time=S.reminder.split(':').map(Number),stamp=base.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}Z$/,'Z');
 let lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Labas//Lesson 8//UK','CALSCALE:GREGORIAN'];
 for(const offset of mode==='daily'?[0]:[1,3,7,14]){
  const d=new Date(base);d.setDate(d.getDate()+offset);d.setHours(time[0],time[1],0,0);if(mode==='daily'&&d<=base)d.setDate(d.getDate()+1);
  const start=dateKey(d).replace(/-/g,'')+'T'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0')+'00';
  lines.push('BEGIN:VEVENT','UID:labas8-'+mode+'-'+stamp+'-'+offset+'@local','DTSTAMP:'+stamp,'DTSTART:'+start,'DURATION:PT10M','SUMMARY:'+icsEscape('Литовська: урок 8'),'DESCRIPTION:'+icsEscape('Відкрий index.html. Повтори картки й виконай коротке тренування.'));
  if(mode==='daily')lines.push('RRULE:FREQ=DAILY;COUNT=30');
  lines.push('BEGIN:VALARM','TRIGGER:-PT0M','ACTION:DISPLAY','DESCRIPTION:'+icsEscape('Час для литовської: Labas!'),'END:VALARM','END:VEVENT');
 }
 lines.push('END:VCALENDAR');return lines.map(foldIcs).join('\r\n')+'\r\n';
}
function confirm(title,copy,run){const d=document.getElementById('confirm-dialog');document.getElementById('confirm-title').textContent=title;document.getElementById('confirm-copy').textContent=copy;document.getElementById('confirm-no').onclick=()=>d.close();document.getElementById('confirm-yes').onclick=()=>{d.close();run();};d.showModal();}
function render(keepScroll=false){
 const scroll=window.scrollY,quizMode=view==='quiz';
 const screens={course:screenCourse,unit:screenUnit,practice:screenPractice,quiz:screenQuiz,result:screenResult,dialogues:screenDialogues,dialogue:screenDialogue,dictionary:screenDictionary,cards:screenCards,pairs:screenPairs,builder:screenBuilder,profile:screenProfile,sources:screenSources,verbs:screenVerbs};
 const body=(screens[view]||screenCourse)();
 app.innerHTML=`<div class="app-shell ${quizMode?'quiz-shell':''}">${!quizMode?header():''}${!storageOK?'<div class="quiz-storage-warning">Браузер не дозволяє зберегти прогрес. Після заняття завантаж JSON-копію у профілі.</div>':''}<main id="main" tabindex="-1">${body}</main>${!quizMode?nav():''}</div>`;
 if(keepScroll)window.scrollTo(0,scroll);else window.scrollTo(0,0);
 if(quizMode&&quiz.checked)requestAnimationFrame(()=>document.querySelector('.feedback')?.scrollIntoView({block:'nearest',behavior:'auto'}));
 document.title='Labas! · '+(view==='quiz'?quiz.title:view==='unit'?U[unitId].title:'Литовська · Урок 8');
}
function go(id){stopSpeech();if(view==='cards')flash=null;view=id;render();}
app.addEventListener('click',event=>{const b=event.target.closest('[data-action]');if(!b||b.disabled)return;const action=b.dataset.action,id=b.dataset.id;
 switch(action){
 case 'due':view='cards';startFlash('due');break;
 case 'dict-all':dictFav=false;dictLesson='all';render(true);break;
 case 'verb-drill':startQuiz(D.questions.filter(q=>q.verb===id),{title:'Дієслово '+id,n:12});break;
 case 'verb-next':case 'verb-prev':{const i=D.verbs.findIndex(x=>x.inf===verbId);verbId=D.verbs[(i+(action==='verb-next'?1:-1)+D.verbs.length)%D.verbs.length].inf;render();break;}
 case 'read-text':dialogueId='r8';go('dialogue');break;

 case 'go':go(id);break;
 case 'lesson':S.settings.lesson=Number(id);save();render(true);break;
 case 'unit':unitId=id;go('unit');break;
 case 'read':S.read[id]=true;save();toast('Пояснення прочитано. Закріпи знання у вправах.');render(true);break;
 case 'train':startQuiz(D.questions.filter(q=>q.unit===id),{title:U[id].title,unit:id});break;
 case 'quick':startQuiz(D.questions.filter(q=>U[q.unit].lesson===S.settings.lesson),{title:'Змішана практика · урок '+S.settings.lesson});break;
 case 'mistakes':{const pool=Object.keys(S.errors).filter(id=>Q[id]).map(id=>Q[id]);if(!pool.length)toast('Помилок для повторення немає. Спробуй змішане тренування.');else startQuiz(pool,{title:'Мої помилки'});break;}
 case 'buildquiz':startQuiz(D.questions.filter(q=>q.kind==='build'),{title:'Конструктор речень'});break;
 case 'writequiz':startQuiz(D.questions.filter(q=>q.kind==='input'&&U[q.unit].lesson===S.settings.lesson),{title:'Письмо · урок '+S.settings.lesson});break;
 case 'exam':exam(id);break;
 case 'choose':quiz.value=quiz.queue[quiz.at].choices[Number(id)];render(true);break;
 case 'letter':{const input=document.getElementById('answer');if(input&&!quiz.checked){const start=input.selectionStart??input.value.length,end=input.selectionEnd??start;input.value=input.value.slice(0,start)+id+input.value.slice(end);quiz.value=input.value;input.focus();input.setSelectionRange(start+1,start+1);}break;}
 case 'token':quiz.queue[quiz.at].selected.push(Number(id));render(true);break;
 case 'untoken':{const q=quiz.queue[quiz.at];q.selected=q.selected.filter(i=>i!==Number(id));render(true);break;}
 case 'check':checkAnswer();break;
 case 'next':nextQuestion();break;
 case 'exit-quiz':confirm('Завершити тренування?','Відповіді вже збережено. Результат блока або тесту з’явиться після повного проходження.',()=>{quiz=null;go('practice');});break;
 case 'retry-session':{const qs=quiz.choicesMissed.map(x=>Q[x.id]);startQuiz(qs,{title:'Закріплення помилок',n:qs.length,exact:true});break;}
 case 'dialogue':dialogueId=id;trans=false;go('dialogue');break;
 case 'translation':trans=!trans;render(true);break;
 case 'dialogue-quiz':startQuiz(D.questions.filter(q=>q.dialogue===id),{title:D.dialogues.find(d=>d.id===id).title,exact:true});break;
 case 'speak-dialogue':{const d=D.dialogues.find(x=>x.id===id);speak(d.lines.map(x=>x[1]).join(' '));break;}
 case 'speak-card':speak(C[id].lt);break;
 case 'speak-builder':speak(builderText().join(' '));break;
 case 'stop-speech':stopSpeech();break;
 case 'dict-filter':dictLesson=id;render(true);break;
 case 'dict-fav':dictFav=!dictFav;render(true);break;
 case 'favorite':S.favorites[id]=!S.favorites[id];if(!S.favorites[id])delete S.favorites[id];save();{const list=dictionaryList();document.getElementById('dictionary-results').innerHTML=list.html;document.getElementById('dict-count').textContent='Знайдено: '+list.found.length;}break;
 case 'flash-start':startFlash(id);break;
 case 'flash-reveal':flash.shown=true;render(true);break;
 case 'flash-rate':if(flash.shown){const success=id==='yes';scoreCard(flash.ids[flash.at],success);if(success)flash.known++;activity(success?5:0);flash.at++;flash.shown=false;save();render();}break;
 case 'flash-exit':flash=null;render();break;
 case 'flash-again':flash=null;render();break;
 case 'pairs':startPairs();break;
 case 'pair':{const [side,cid]=id.split('|');pairs.wrong=[];if(side==='left')pairs.selectedL=cid;else pairs.selectedR=cid;
 if(pairs.selectedL&&pairs.selectedR){pairs.tries++;if(pairs.selectedL===pairs.selectedR){pairs.done.push(cid);activity(4);save();}else{pairs.wrong=['left'+pairs.selectedL,'right'+pairs.selectedR];toast('Спробуй іншу пару.');}pairs.selectedL=null;pairs.selectedR=null;}render(true);break;}
 case 'calendar':download('labas-8-'+id+'.ics',calendarText(id),'text/calendar;charset=utf-8');toast('Файл календаря готовий. Імпортуй його в календар телефона.');break;
 case 'download-story':download('mano-pasakojimas.txt',builderText().join('\n'),'text/plain;charset=utf-8');break;
 case 'export':download('labas-8-progress-'+dateKey()+'.json',JSON.stringify({...S,exported:new Date().toISOString()},null,2),'application/json');toast('Резервну копію завантажено.');break;
 case 'import':document.getElementById('backup-file').click();break;

 }
});
